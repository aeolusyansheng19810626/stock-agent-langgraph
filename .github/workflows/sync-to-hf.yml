name: Sync to HuggingFace Space

on:
  push:
    branches: [master]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space https://aeolusyansheng:$HF_TOKEN@huggingface.co/spaces/aeolusyansheng/stock-agent-langgraph
          git push space master --force
